# ~/.cayo/overrides/<project>.yml: run a project's dev services on its guest's network only, with
# no published ports (README.md, Dev services). From the project's clean clone, at a reviewed commit:
#   docker --context colima-cayo compose -f docker-compose.yml -f ~/.cayo/overrides/<project>.yml up -d
# Create the guest first: it creates the network. Every service gets the same three lines. Files
# the compose file bind-mounts from the clean clone must be in the VM's mounts (CAYO_VM_MOUNTS).
# cap_drop NET_RAW: the guest can often run code in a dev service, and raw sockets are how a
# container sends packets it isn't meant to (it costs the service only `ping`).
services:
  app-postgres:
    networks: !override [cayo]
    ports: !reset []
    cap_drop: [NET_RAW]
networks:
  cayo:
    name: cayo-trusted-shop
    external: true
