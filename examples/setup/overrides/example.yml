# ~/.aiws/overrides/<project>.yml: run a project's dev services on its guest's network only, with
# no published ports (SETUP.md §12). From the project's clean clone, at a reviewed commit:
#   docker --context colima-aiws compose -f docker-compose.yml -f ~/.aiws/overrides/<project>.yml up -d
# Create the guest first: it creates the network. Every service gets the same two lines. Files the
# compose file bind-mounts from the clean clone must be in the VM's mounts (SETUP.md §2).
services:
  app-postgres:
    networks: !override [aiws]
    ports: !reset []
networks:
  aiws:
    name: aiws-trusted-shop
    external: true
